name: CI

on:
  push:
    branches: [main, msm-2.0]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # La double plateforme n'est pas cosmétique : la gestion des processus
        # diffère fondamentalement entre POSIX et Windows. Sans cette matrice,
        # la portabilité se dégraderait sans que personne ne s'en aperçoive.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Installer les dépendances Windows optionnelles
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,windows]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff)
        run: ruff format --check .

      - name: Tests
        run: pytest -q --cov=msm --cov-report=term-missing

      - name: Vérifier que les migrations couvrent le schéma
        if: runner.os == 'Linux'
        env:
          MSM_SECRET_KEY: cle-de-test-ci-suffisamment-longue-pour-passer-la-validation
        run: |
          alembic upgrade head
          # Une différence détectée ici signifie qu'un modèle a changé sans migration.
          alembic check
