<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Server Manager</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        /* Style global */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Conteneur principal pour l'interface */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            height: 90vh;
            gap: 20px;
        }

        /* Conteneur de l'état du serveur */
        #server-status {
            text-align: center;
            margin-bottom: 10px;
            margin-top: -30px;
        }

        /* Couleurs pour le statut du serveur */
        .status-running {
            color: green;
        }

        .status-stopped {
            color: red;
        }
        
        #start-btn {
            border-radius: 20px;
            background-color: #00B600;
        }
        
        #stop-btn {
            border-radius: 20px;
            background-color: #D61900;
        }

        /* Conteneur pour les sections logs et chat */
        .section-container {
            display: flex;
            width: 100%;
            gap: 20px;
            height: 90%;
        }

        /* Style des sections server et chat */
        .section {
            width: 50%;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .section h2 {
            margin-left: 10px;
        }

        /* Zone de logs et de chat avec une hauteur fixe et scrollable */
        .content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            height: calc(100% - 40px);
            max-height: 100%;
        }

        /* Style des messages normaux */
        .chat-message {
            padding: 8px;
            border-radius: 8px;
            margin: 5px 0;
            max-width: 75%;
            background-color: #e0e0e0;
            align-self: flex-start;
            display: inline-block;
        }

        /* Style des messages du serveur */
        .server-message {
            padding: 8px;
            border-radius: 8px;
            margin: 5px 0;
            background-color: #007BFF;
            color: white;
            text-align: left;
            align-self: flex-end;
            max-width: 75%;
            display: inline-block;
            word-wrap: break-word;
        }

        /* Entrée de message pour la section chat */
        .input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
            background-color: #eee;
        }

        .input-container input {
            flex: 1;
            padding: 5px;
            margin-right: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .input-container button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        .input-container button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- État du serveur -->
        <div id="server-status">
            <h2>État du Serveur : <span id="status-text" class="{{ 'status-running' if server_status == 'Démarré' else 'status-stopped' }}">{{ server_status }}</span></h2>
            <button id="start-btn" onclick="startServer()" style="display: {{ 'none' if server_status == 'Démarré' else 'inline' }}">Démarrer</button>
            <button id="stop-btn" onclick="stopServer()" style="display: {{ 'inline' if server_status == 'Démarré' else 'none' }}">Arrêter</button>
        </div>

        <div class="section-container">
            <!-- Section Logs du Serveur -->
            <div class="section" id="server-section">
                <h2>Logs du Serveur</h2>
                <div class="content" id="server"></div>
            </div>

            <!-- Section Chat -->
            <div class="section" id="chat-section">
                <h2>Chat du Serveur</h2>
                <div class="content" id="chat"></div>
                <div class="input-container">
                    <input id="message" type="text" placeholder="Votre message">
                    <button onclick="sendMessage()">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

<script>
    let lastLogLength = 0;
    let lastMessageCount = 0;

    function updateServerStatus(status) {
        const statusText = document.getElementById('status-text');
        statusText.textContent = status;
        statusText.className = status === 'Démarré' ? 'status-running' : 'status-stopped';
        document.getElementById('start-btn').style.display = status === 'Démarré' ? 'none' : 'inline';
        document.getElementById('stop-btn').style.display = status === 'Démarré' ? 'inline' : 'none';
    }

    function startServer() {
        fetch('/start_server', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                updateServerStatus(data.status);
                lastLogLength = 0;
                lastMessageCount = 0;
                fetchLogs();
                fetchChatMessages();
            });
    }

    function stopServer() {
        fetch('/stop_server', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                updateServerStatus(data.status);
                lastLogLength = 0;
                lastMessageCount = 0;
                fetchLogs();
                fetchChatMessages();
            });
    }

    function fetchLogs() {
        fetch('/logs')
            .then(response => response.json())
            .then(data => {
                const serverDiv = document.getElementById('server');
                const logs = data.logs;

                if (logs.length > lastLogLength) {
                    for (let i = lastLogLength; i < logs.length; i++) {
                        const log = logs[i];
                        const logElement = document.createElement('p');
                        logElement.textContent = log;
                        serverDiv.appendChild(logElement);
                    }
                    lastLogLength = logs.length;
                    serverDiv.scrollTop = serverDiv.scrollHeight;
                }
            });
    }

    setInterval(fetchLogs, 200);
    
    function fetchChatMessages() {
        fetch('/chat_messages')
            .then(response => response.json())
            .then(data => {
                const chatDiv = document.getElementById('chat');
                const messages = data.messages;

                if (messages.length > lastMessageCount) {
                    for (let i = lastMessageCount; i < messages.length; i++) {
                        const message = messages[i];

                        // Identifier si le message est du serveur ou d'un joueur
                        const serverRegex = /^\<Serveur\> (.+)$/;
                        const isServerMessage = serverRegex.test(message);
                        const messageElement = document.createElement('p');

                        if (isServerMessage) {
                            // Message du serveur
                            messageElement.classList.add('server-message');
                            messageElement.innerHTML = `<strong>Serveur:</strong> ${message.replace("[Server] ", "")}`;
                        } else {
                            // Message d'un joueur, extraire le pseudo et le message
                            const playerRegex = /^<([^>]+)> (.+)$/;
                            const match = message.match(playerRegex);
                            if (match) {
                                const pseudo = match[1];
                                const playerMessage = match[2];
                                messageElement.classList.add('chat-message');
                                messageElement.innerHTML = `<strong>${pseudo}:</strong> ${playerMessage}`;
                            }
                        }
                        chatDiv.appendChild(messageElement);
                    }
                    lastMessageCount = messages.length;
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                }
            });
    }

    setInterval(fetchChatMessages, 200);

    function sendMessage() {
        const message = document.getElementById('message').value;
        fetch('/send_message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        document.getElementById('message').value = '';
    }
</script>
</body>
</html>
